<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WORDADLE</title>
  <style>
    :root { --size: 60px; --gap: 8px; --bg: #121213; --tile: #3a3a3c; --absent:#3a3a3c; --present:#b59f3b; --correct:#538d4e; --text:#fff; }
    body { margin:0; background:var(--bg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; color:var(--text); display:flex; align-items:center; justify-content:center; height:100vh; }
    .game { width: min(560px, 95vw); }
    h1 { text-align:center; font-size: 22px; font-weight: 700; margin: 8px 0 16px; letter-spacing: 2px; }
    .board { display:grid; grid-template-rows: repeat(6, var(--size)); gap: var(--gap); }
    .row { display:grid; grid-template-columns: repeat(6, var(--size)); gap: var(--gap); justify-content:center; }
    .tile { border:2px solid #3a3a3c; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; text-transform:uppercase; background:#121213; color:var(--text); }
    .tile.filled { border-color:#565758; }
    .tile.absent { background: var(--absent); border-color: var(--absent); }
    .tile.present { background: var(--present); border-color: var(--present); }
    .tile.correct { background: var(--correct); border-color: var(--correct); }
    .kbd { margin-top: 14px; display:grid; grid-template-columns: repeat(20, 1fr); gap:6px; user-select:none; }
    .key { grid-column: span 2; background:#818384; color:#fff; border:none; border-radius:6px; padding:10px 0; font-weight:700; cursor:pointer; }
    .key.wide { grid-column: span 3; font-size: 12px; }
    .key.tiny { font-size: 12px; }
    .key.absent { background:#3a3a3c; }
    .key.present { background:#b59f3b; }
    .key.correct { background:#538d4e; }
    .bar { display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
    .msg { text-align:center; min-height: 22px; margin-top: 8px; }
    .footer { text-align:center; font-size:12px; opacity:.75; margin-top:10px; }
  </style>
</head>
<body>
  <div class="game">
    <h1>WORDADLE</h1>
    <div class="bar">
      <button id="btn-new">Reiniciar</button>
      <button id="btn-reveal">Mostrar solución</button>
    </div>
    <div id="board" class="board"></div>
    <div id="kbd" class="kbd"></div>
    <div id="msg" class="msg"></div>
    <div class="footer">Hecho para papa 🎉</div>
  </div>

  <script>
    // ======= Parámetros =======
    const WORD_LENGTH = 6;
    const FIXED_ANSWER = "cumple"; // palabra objetivo fija
    // Si quieres permitir sólo palabras válidas, pon una lista aquí (todas de 6 letras).
    // Para esta demo aceptaremos cualquier entrada de 6 letras (sin validar diccionario).

    // ======= Estado =======
    const state = {
      answer: FIXED_ANSWER.toLowerCase(),
      row: 0,
      col: 0,
      grid: Array.from({length:6}, () => Array(WORD_LENGTH).fill("")),
      locks: false,
      kbStatus: {} // letra -> absent|present|correct
    };

    // ======= Utilidades =======
    function setMessage(t) { document.getElementById("msg").textContent = t || ""; }
    function normalize(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

    // ======= Render =======
    const board = document.getElementById("board");
    function renderBoard(){
      board.innerHTML = "";
      for(let r=0; r<6; r++){
        const row = document.createElement("div");
        row.className = "row";
        for(let c=0; c<WORD_LENGTH; c++){
          const tile = document.createElement("div");
          tile.className = "tile" + (state.grid[r][c] ? " filled" : "");
          tile.textContent = state.grid[r][c];
          row.appendChild(tile);
        }
        board.appendChild(row);
      }
    }
    function paintRow(r, colors){
      const rowEl = board.children[r];
      for(let c=0;c<WORD_LENGTH;c++){
        const tile = rowEl.children[c];
        tile.classList.remove("filled");
        tile.classList.add(colors[c]);
      }
    }

    // ======= Teclado =======
    const KEY_ROWS = ["QWERTYUIOP", "ASDFGHJKLÑ", "⌫ZXCVBNM↵"];
    const kbd = document.getElementById("kbd");
    function renderKeyboard(){
      kbd.innerHTML = "";
      KEY_ROWS.forEach(row=>{
        for(const ch of row){
          const btn = document.createElement("button");
          btn.className = "key";
          let label = ch;
          if(ch==="⌫"){ btn.classList.add("wide","tiny"); label="Borrar"; }
          if(ch==="↵"){ btn.classList.add("wide","tiny"); label="Enter"; }
          btn.textContent = label;
          if(/[A-ZÑ]/.test(ch)){
            const s = state.kbStatus[ch] || "";
            if(s) btn.classList.add(s);
          }
          btn.onclick = ()=> handleKey(ch);
          kbd.appendChild(btn);
        }
      });
    }

    // ======= Lógica =======
    function start(){
      state.row = 0; state.col = 0;
      state.grid = Array.from({length:6}, () => Array(WORD_LENGTH).fill(""));
      state.locks = false; state.kbStatus = {};
      setMessage("");
      renderBoard(); renderKeyboard();
    }

    function handleKey(ch){
      if(state.locks) return;
      if(ch==="⌫"){ backspace(); return; }
      if(ch==="↵"){ enter(); return; }
      if(/[A-ZÑ]/.test(ch)){ addLetter(ch.toLowerCase()); }
    }

    function addLetter(l){
      if(state.col>=WORD_LENGTH) return;
      state.grid[state.row][state.col] = l;
      state.col++;
      renderBoard();
    }

    function backspace(){
      if(state.col<=0) return;
      state.col--;
      state.grid[state.row][state.col] = "";
      renderBoard();
    }

    function enter(){
      if(state.col<WORD_LENGTH){ setMessage(`La palabra debe tener ${WORD_LENGTH} letras.`); return; }
      const guess = normalize(state.grid[state.row].join(""));
      const answer = normalize(state.answer);

      // (Opcional) Validación: aquí podrías comprobar contra una lista de 6 letras
      // En esta demo no filtramos: aceptamos cualquier palabra de 6 letras.

      setMessage("");

      // Colores
      const colors = Array(WORD_LENGTH).fill("absent");
      const count = {};
      for(const ch of answer){ count[ch] = (count[ch]||0) + 1; }

      // Correctos
      for(let i=0;i<WORD_LENGTH;i++){
        if(guess[i] === answer[i]){
          colors[i] = "correct";
          count[guess[i]]--;
        }
      }
      // Presentes
      for(let i=0;i<WORD_LENGTH;i++){
        if(colors[i]==="correct") continue;
        const g = guess[i];
        if(count[g]>0){
          colors[i] = "present";
          count[g]--;
        }
      }

      // Pintar fila
      paintRow(state.row, colors);

      // Actualizar teclado
      for(let i=0;i<WORD_LENGTH;i++){
        const up = guess[i].toUpperCase();
        const current = state.kbStatus[up] || "";
        const next = colors[i];
        const rank = { "":0, "absent":1, "present":2, "correct":3 };
        if(rank[next] > rank[current]) state.kbStatus[up] = next;
      }
      renderKeyboard();

      // Fin de juego
      if(guess === answer){
        setMessage("¡Exacto! ✅");
        state.locks = true; return;
      }
      state.row++; state.col=0;
      if(state.row>=6){
        setMessage(`Fin. La palabra era: ${state.answer.toUpperCase()}`);
        state.locks = true;
      }
    }

    // Teclado físico
    window.addEventListener("keydown", (e)=>{
      const k = e.key;
      if(k==="Backspace") handleKey("⌫");
      else if(k==="Enter") handleKey("↵");
      else if(/^[a-zA-ZñÑ]$/.test(k)) handleKey(k.toUpperCase());
    });

    document.getElementById("btn-new").onclick = start;
    document.getElementById("btn-reveal").onclick = ()=>setMessage(`Solución: ${state.answer.toUpperCase()}`);
    start();
  </script>
</body>
</html>
